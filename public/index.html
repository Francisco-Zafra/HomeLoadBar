<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08110E">
<title>Entrega del mejor piso del mundo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233BE58A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 10.5 12 3l9 7.5'/%3E%3Cpath d='M5 9.5V21h14V9.5'/%3E%3Cpath d='M10 21v-6h4v6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08110E;overflow:hidden}
a{color:#3BE58A}a:hover{color:#8CF5BB}
.shell{position:relative;height:100vh;height:100dvh;box-sizing:border-box;padding:max(14px,env(safe-area-inset-top)) 20px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
.a-head,.stage{position:relative;z-index:1}
.stage{flex:1 1 auto;min-height:0;width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center}
.cd>div+div{border-left:1px solid rgba(232,242,236,.14)}
.ms-label{display:block}
.mi svg{width:18px;height:18px}
.hdr-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid #24443A;border-radius:999px;background:rgba(10,22,18,.6);color:#E8F2EC;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.hdr-btn:hover{border-color:#3BE58A}
.pick{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;box-sizing:border-box;padding:0 12px;border-radius:10px;border:1px dashed #3A5A4E;background:#0C1814;color:#B9CCC2;font:500 14px Inter,system-ui,sans-serif;cursor:pointer}
.pick:hover,.pick:focus-within{border-color:#3BE58A}
.pick input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.txt-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;border:0;background:none;color:#E8F2EC;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.txt-btn:hover{color:#3BE58A}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(255,210,122,.7)}100%{box-shadow:0 0 0 10px rgba(255,210,122,0)}}
@keyframes beat{0%,60%,100%{transform:scale(1)}12%{transform:scale(1.2)}24%{transform:scale(1)}36%{transform:scale(1.12)}}
@keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
/* ---- Diario de obra: línea de tiempo ---- */
.dy{position:relative;width:min(480px,100%);height:100%;box-sizing:border-box;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;background:#0A1512;border-left:1px solid #1F3A30;animation:slideIn .35s ease-out both}
.dy-top{padding:max(18px,env(safe-area-inset-top)) 20px 14px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#0E1C17 0%,#0A1512 100%)}
.dy-pad{padding:0 20px max(28px,env(safe-area-inset-bottom))}
.dy-cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:0;border-radius:14px;color:#08110E;font:700 15px Inter,system-ui,sans-serif;cursor:pointer}
.dy-month{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 -20px;padding:14px 20px 10px;background:rgba(10,21,18,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dy-month h3{margin:0;font:800 22px 'Big Shoulders Display',Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.dy-month span{font-size:12px;color:#8FA89B}
.tl{list-style:none;margin:0;padding:0}
.tl-item{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:6px 0 24px;animation:popIn .3s ease-out both}
.tl-item::before{content:"";position:absolute;left:21px;top:52px;bottom:0;width:2px;border-radius:2px;background:linear-gradient(180deg,#2A4A3E,rgba(42,74,62,.25))}
.tl-item:last-child::before{display:none}
.tl-date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:46px;border-radius:12px;background:#10221B;border:1px solid #24443A;line-height:1}
.tl-date b{font:800 22px 'Big Shoulders Display',Impact,sans-serif}
.tl-date i{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8FA89B;margin-top:2px}
.tl-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.tl-meta{display:flex;flex-direction:column;gap:6px}
.tl-meta strong{font-size:15px}
.tl-meta small{font-size:12px;color:#8FA89B}
.tl-pct{display:flex;align-items:center;gap:10px;font-size:12px;color:#B9CCC2}
.tl-track{position:relative;flex:1 1 auto;height:6px;border-radius:999px;background:rgba(232,242,236,.1);overflow:hidden}
.tl-delta{white-space:nowrap;padding:2px 8px;border-radius:999px;background:rgba(59,229,138,.12);color:#8CF5BB;font-weight:600}
.tl-hero{position:relative;display:block;width:100%;padding:0;border:0;border-radius:14px;overflow:hidden;background:#10221B;cursor:zoom-in}
.tl-hero img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.tl-hero .more{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(8,17,14,.78);color:#E8F2EC;font-size:12px;font-weight:600}
.tl-thumbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:-4px}
.tl-thumbs::-webkit-scrollbar{display:none}
.tl-thumbs button{flex:none;width:64px;height:64px;padding:0;border:0;border-radius:10px;overflow:hidden;background:#10221B;cursor:zoom-in}
.tl-thumbs img{display:block;width:100%;height:100%;object-fit:cover}
.tl-note{margin:0;padding:10px 12px;border-left:2px solid #3A5A4E;color:#CFE3D8;font-size:14px;white-space:pre-line}
.df{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:18px;background:#0F1F19;border:1px solid #2A4A3E;animation:popIn .25s ease-out both}
.df-field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#CFE3D8}
.df-input{min-height:46px;box-sizing:border-box;padding:0 12px;border-radius:12px;border:1px solid #2F4A3E;background:#0A1512;color:#E8F2EC;font:500 16px Inter,system-ui,sans-serif}
.df-thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.df-thumb{position:relative;border-radius:10px;overflow:hidden;background:#10221B}
.df-thumb img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.df-x{position:absolute;top:0;right:0;width:36px;height:36px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:flex-start;justify-content:flex-end}
.df-x span{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin:4px;border-radius:50%;background:rgba(8,17,14,.85);color:#E8F2EC}
.df-done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,17,14,.45)}
.df-prog{display:flex;flex-direction:column;gap:6px}
.df-prog-track{height:8px;border-radius:999px;background:rgba(232,242,236,.1);overflow:hidden}
.pv{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:56px 12px;box-sizing:border-box;background:rgba(3,8,6,.94);cursor:zoom-out;animation:popIn .2s ease-out both;touch-action:pan-y}
.pv img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);user-select:none;-webkit-user-drag:none}
.pv-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;padding:0;border:1px solid #24443A;border-radius:50%;background:rgba(10,22,18,.7);color:#E8F2EC;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pv-count{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:rgba(10,22,18,.8);font-size:13px;font-weight:600;letter-spacing:.04em}
@media (max-width:640px){.pv-nav{width:44px;height:44px}.pv-prev{left:8px!important}.pv-next{right:8px!important}}
@media (max-width:640px){.ms-label{display:none}.ms-keep{display:block!important}.m-hide{display:none!important}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="shell" style="background: radial-gradient(ellipse 90% 60% at 50% 25%, #10261D 0%, #08110E 70%); color: #E8F2EC; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45">

  <!-- Agua que sube con el porcentaje -->
  <canvas data-water="1" ref="{{setCanvas}}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none"></canvas>

  <!-- Cabecera -->
  <header class="a-head" style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <span style="display: inline-flex; align-items: center; gap: 10px; font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3BE58A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg>
      <span class="m-hide">Piso.exe</span>
    </span>
    <button type="button" class="txt-btn" onClick="{{openDiary}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"></path><circle cx="12" cy="13" r="3"></circle></svg>
      Diario de obra
    </button>
  </header>

  <main class="stage">
    <!-- Título -->
    <div class="fade-up" style="display: flex; flex-direction: column; gap: 6px">
      <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: #8FA89B">Cuenta atrás</p>
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 800; font-size: clamp(24px, 6.4vw, 40px); line-height: 1; letter-spacing: 0.05em; text-transform: uppercase; text-wrap: balance">Entrega del mejor piso del mundo</h1>
    </div>

    <!-- Porcentaje gigante -->
    <div class="fade-up" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; animation-delay: .1s">
      <span aria-hidden="true" style="position: absolute; left: 10%; right: 10%; top: 15%; bottom: 25%; border-radius: 50%; background: {{glow}}; filter: blur(60px); animation: glowPulse 3.2s ease-in-out infinite"></span>
      <p style="position: relative; margin: 0; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: min(36vw, 27vh, 270px); line-height: 0.85; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: {{accent}}; text-shadow: 0 0 40px {{glow}}">{{pctInt}}<span style="font-size: 0.42em">,{{pctDec}}%</span></p>
      <p style="position: relative; margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: #8FA89B">completado</p>
      <p style="position: relative; margin: 6px 0 0; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: #CFE3D8">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFD27A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4"></path><path d="M4 4h12l-2 4 2 4H4"></path></svg>
        <span>Próximo: <strong style="font-weight: 600; color: #FFD27A">{{nextName}}</strong> · {{nextIn}}</span>
      </p>
    </div>

    <!-- Barra de hitos: una línea fina con puntos -->
    <div class="fade-up" aria-label="Progreso por hitos" style="width: 100%; max-width: 680px; box-sizing: border-box; padding: 0 12px; animation-delay: .2s">
      <div style="position: relative; height: 66px; --nh: 0px">
        <div style="position: absolute; left: 0; right: 0; top: 32px; height: 3px; border-radius: 999px; background: rgba(232,242,236,.14)"></div>
        <div style="{{barStyle}}"></div>
        <sc-for list="{{milestones}}" as="m" hint-placeholder-count="7">
          <div style="{{m.nodeWrap}}">
            <span class="mi" aria-hidden="true" style="display: inline-flex; height: 18px; color: {{m.iconColor}}">
            <sc-if value="{{m.isClip}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg></sc-if>
            <sc-if value="{{m.isDoc}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M8 17c1.5-2 2.5-2 3 0s1.5 1.5 3-1"></path></svg></sc-if>
            <sc-if value="{{m.isPay}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle><path d="M6 12h.01M18 12h.01"></path></svg></sc-if>
            <sc-if value="{{m.isKey}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"></circle><path d="m10.7 12.3 9.8-9.8"></path><path d="m17 6 3 3"></path><path d="m14.5 8.5 2 2"></path></svg></sc-if>
            </span>
            <span style="{{m.node}}"></span>
            <span class="{{m.labelClass}}" style="font-size: 11px; font-weight: 600; white-space: nowrap; line-height: 1.1; color: {{m.textColor}}">{{m.name}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- Tiempo restante: números sueltos separados por líneas finas -->
    <div class="cd fade-up" style="width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); animation-delay: .3s">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: clamp(40px, 11vw, 68px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">{{days}}</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #8FA89B">días</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: clamp(40px, 11vw, 68px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">{{hours}}</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #8FA89B">horas</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: clamp(40px, 11vw, 68px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">{{mins}}</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #8FA89B">min</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: clamp(40px, 11vw, 68px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: {{accent}}; text-shadow: 0 0 20px {{glow}}">{{secs}}</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #8FA89B">seg</span>
      </div>
    </div>

    <!-- Hype -->
    <button type="button" onClick="{{addHype}}" aria-label="Subir el hype" class="fade-up" style="display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 8px; border: 0; background: none; color: #E8F2EC; cursor: pointer; animation-delay: .4s">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="#FF6B8B" aria-hidden="true" style="filter: drop-shadow(0 0 10px rgba(255,107,139,.7)); animation: beat 1.4s ease-in-out infinite"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"></path></svg>
      <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; line-height: 1">
        <span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: 34px; font-weight: 900; color: #FF6B8B; font-variant-numeric: tabular-nums">{{hype}}</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #FFB3C3">nivel de hype</span>
      </span>
    </button>
  </main>

  <!-- Diario de obra -->
  <sc-if value="{{diaryOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 20; display: flex; justify-content: flex-end">
      <button type="button" aria-label="Cerrar el diario" onClick="{{closeDiary}}" style="position: absolute; inset: 0; border: 0; background: rgba(3,8,6,.62); cursor: pointer"></button>
      <aside class="dy" aria-label="Diario de obra">
        <div class="dy-top">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: #8FA89B">Diario de obra</span>
              <strong style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: 34px; font-weight: 800; line-height: 1; text-transform: uppercase">Así va el piso</strong>
              <sc-if value="{{hasVisits}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 13px; color: #B9CCC2">{{diaryStats}}</span>
              </sc-if>
            </div>
            <button type="button" class="hdr-btn" aria-label="Cerrar el diario" onClick="{{closeDiary}}" style="flex: none; width: 44px; padding: 0; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
            </button>
          </div>
          <sc-if value="{{showCta}}" hint-placeholder-val="{{ true }}">
            <button type="button" class="dy-cta" onClick="{{openForm}}" style="background: {{accent}}; box-shadow: 0 8px 24px {{glow}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              Nueva visita al piso
            </button>
          </sc-if>
        </div>

        <div class="dy-pad">
          <!-- Formulario de nueva visita -->
          <sc-if value="{{formOpen}}" hint-placeholder-val="{{ false }}">
            <form class="df" onSubmit="{{saveVisit}}">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <strong style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase">Nueva visita</strong>
                <sc-if value="{{resuming}}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 12px; color: #FFD27A">Continuando la subida</span>
                </sc-if>
              </div>
              <label class="df-field">
                Fecha de la visita
                <input class="df-input" type="date" required value="{{draftDate}}" onChange="{{setDraftDate}}" disabled="{{resuming}}" style="color-scheme: dark">
              </label>
              <div class="df-field">
                <span>Fotos <span style="font-weight: 500; color: #8FA89B">· {{draftCount}}</span></span>
                <div style="display: flex; gap: 8px">
                  <label class="pick" style="flex: 1 1 auto">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg>
                    Elegir fotos
                    <input type="file" accept="image/*" multiple onChange="{{addDraftPhotos}}">
                  </label>
                  <!-- en el móvil abre directamente la cámara -->
                  <label class="pick" title="Hacer una foto" style="flex: none; width: 52px; padding: 0; border-style: solid; color: {{accent}}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"></path><circle cx="12" cy="13" r="3"></circle></svg>
                    <input type="file" accept="image/*" capture="environment" aria-label="Hacer una foto" onChange="{{addDraftPhotos}}">
                  </label>
                </div>
                <sc-if value="{{hasDraftPhotos}}" hint-placeholder-val="{{ false }}">
                  <div class="df-thumbs">
                    <sc-for list="{{draftPhotosView}}" as="ph" hint-placeholder-count="2">
                      <div class="df-thumb">
                        <img src="{{ph.url}}" alt="{{ph.name}}">
                        <sc-if value="{{ph.done}}" hint-placeholder-val="{{ false }}">
                          <span class="df-done" title="Ya subida"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3BE58A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
                        </sc-if>
                        <sc-if value="{{ph.canRemove}}" hint-placeholder-val="{{ true }}">
                          <button type="button" class="df-x" aria-label="Quitar esta foto" onClick="{{ph.remove}}"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></span></button>
                        </sc-if>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>
              </div>
              <label class="df-field">
                Notas
                <textarea class="df-input" rows="3" value="{{draftNote}}" onChange="{{setDraftNote}}" disabled="{{resuming}}" placeholder="¿Qué habéis visto hoy?" style="padding: 10px 12px; resize: vertical; font-weight: 400"></textarea>
              </label>
              <label class="df-field">
                PIN del diario
                <input class="df-input" type="password" inputmode="numeric" autocomplete="current-password" value="{{draftPin}}" onChange="{{setDraftPin}}">
              </label>
              <sc-if value="{{uploading}}" hint-placeholder-val="{{ false }}">
                <div class="df-prog" role="progressbar" aria-label="Subiendo fotos" aria-valuemin="0" aria-valuemax="{{uploadTotal}}" aria-valuenow="{{uploadDone}}">
                  <div class="df-prog-track"><div style="{{uploadBar}}"></div></div>
                </div>
              </sc-if>
              <sc-if value="{{hasFormError}}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; font-size: 13px; color: #FFB98F">{{formError}}</p></sc-if>
              <div style="display: flex; justify-content: flex-end; gap: 8px">
                <button type="button" class="hdr-btn" onClick="{{cancelForm}}" disabled="{{saving}}">Cancelar</button>
                <button type="submit" disabled="{{saving}}" style="min-height: 46px; padding: 0 20px; border: 0; border-radius: 999px; background: {{accent}}; color: #08110E; font: 700 15px Inter, system-ui, sans-serif; cursor: pointer">{{saveLabel}}</button>
              </div>
            </form>
          </sc-if>

          <!-- Estado vacío -->
          <sc-if value="{{showEmpty}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 36px 8px 8px; text-align: center">
              <svg width="168" height="120" viewBox="0 0 168 120" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Edificio en obra con una cámara">
                <path d="M10 108h148" stroke="#24443A" stroke-width="2"></path>
                <path d="M46 108V44l30-20 30 20v64" stroke="#3A5A4E" stroke-width="2" stroke-dasharray="5 5"></path>
                <path d="M62 60h10v10H62zM80 60h10v10H80zM62 78h10v10H62z" stroke="#3A5A4E" stroke-width="2"></path>
                <path d="M80 78h10v10H80z" fill="#FFD27A" stroke="#FFD27A" stroke-width="2" opacity=".9"></path>
                <path d="M130 108V22M130 22H84M130 22l14 6M118 22v4" stroke="#C9A85A" stroke-width="2"></path>
                <path d="M98 22v16" stroke="#8FA89B" stroke-width="1.5"></path>
                <rect x="92" y="38" width="12" height="8" rx="1.5" stroke="#C9A85A" stroke-width="1.5"></rect>
                <rect x="112" y="78" width="40" height="28" rx="6" fill="#0A1512" stroke="#3BE58A" stroke-width="2"></rect>
                <circle cx="132" cy="92" r="7" stroke="#3BE58A" stroke-width="2"></circle>
                <path d="M120 78l4-6h16l4 6" stroke="#3BE58A" stroke-width="2"></path>
                <path d="M22 30l3 3M25 30l-3 3M150 52l3 3M153 52l-3 3" stroke="#FFD27A" stroke-width="1.5"></path>
              </svg>
              <strong style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase">Empieza el álbum de la obra</strong>
              <p style="margin: 0; max-width: 32ch; font-size: 14px; color: #B9CCC2">Cada vez que vayáis a ver el piso, haced unas fotos y guardadlas aquí. Con el tiempo veréis cómo se levanta.</p>
            </div>
          </sc-if>

          <!-- Línea de tiempo, agrupada por meses -->
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="0">
            <section aria-label="{{g.label}}">
              <div class="dy-month">
                <h3>{{g.label}}</h3>
                <span>{{g.countLabel}}</span>
              </div>
              <ol class="tl">
                <sc-for list="{{g.visits}}" as="v" hint-placeholder-count="1">
                  <li class="tl-item">
                    <div class="tl-date" style="{{v.dateStyle}}" aria-hidden="true"><b>{{v.day}}</b><i>{{v.wd}}</i></div>
                    <div class="tl-body">
                      <div class="tl-meta">
                        <strong>{{v.dateLabel}}</strong>
                        <div class="tl-pct">
                          <div class="tl-track" role="img" aria-label="{{v.pctAria}}"><div style="{{v.pctBar}}"></div></div>
                          <span style="white-space: nowrap"><b style="color: #E8F2EC">{{v.pctAt}}</b> de obra</span>
                          <sc-if value="{{v.hasDelta}}" hint-placeholder-val="{{ false }}"><span class="tl-delta" title="Avance desde la visita anterior">{{v.delta}}</span></sc-if>
                        </div>
                        <small>{{v.ago}}</small>
                      </div>
                      <sc-if value="{{v.hasPhotos}}" hint-placeholder-val="{{ false }}">
                        <button type="button" class="tl-hero" aria-label="{{v.heroLabel}}" onClick="{{v.openFirst}}">
                          <img src="{{v.first}}" alt="Foto de la visita" loading="lazy">
                          <sc-if value="{{v.hasMore}}" hint-placeholder-val="{{ false }}">
                            <span class="more"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg>{{v.photoCount}}</span>
                          </sc-if>
                        </button>
                        <sc-if value="{{v.hasMore}}" hint-placeholder-val="{{ false }}">
                          <div class="tl-thumbs">
                            <sc-for list="{{v.thumbs}}" as="ph" hint-placeholder-count="3">
                              <button type="button" aria-label="Ver la foto en grande" onClick="{{ph.open}}"><img src="{{ph.url}}" alt="Foto de la visita" loading="lazy"></button>
                            </sc-for>
                          </div>
                        </sc-if>
                      </sc-if>
                      <sc-if value="{{v.hasNote}}" hint-placeholder-val="{{ false }}">
                        <p class="tl-note">{{v.note}}</p>
                      </sc-if>
                    </div>
                  </li>
                </sc-for>
              </ol>
            </section>
          </sc-for>
        </div>
      </aside>
      <!-- Foto en grande: se cierra tocando en cualquier sitio; flechas o deslizar para cambiar -->
      <sc-if value="{{photoOpen}}" hint-placeholder-val="{{ false }}">
        <div class="pv" role="dialog" aria-label="Foto de la visita" onClick="{{closePhoto}}" onTouchStart="{{photoTouchStart}}" onTouchEnd="{{photoTouchEnd}}">
          <img src="{{photoUrl}}" alt="{{photoCounter}}">
          <button type="button" class="hdr-btn" aria-label="Cerrar la foto" onClick="{{closePhoto}}" style="position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; width: 44px; padding: 0; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
          <sc-if value="{{photoMany}}" hint-placeholder-val="{{ false }}">
            <button type="button" class="pv-nav pv-prev" aria-label="Foto anterior" onClick="{{prevPhoto}}" style="left: 16px">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
            </button>
            <button type="button" class="pv-nav pv-next" aria-label="Foto siguiente" onClick="{{nextPhoto}}" style="right: 16px">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
            </button>
            <span class="pv-count" aria-live="polite">{{photoCounter}}</span>
          </sc-if>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
</template>
<script type="module" src="./main.js"></script>
</body>
</html>
