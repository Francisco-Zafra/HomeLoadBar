<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08110E">
<title>Entrega del mejor piso del mundo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233BE58A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 10.5 12 3l9 7.5'/%3E%3Cpath d='M5 9.5V21h14V9.5'/%3E%3Cpath d='M10 21v-6h4v6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08110E;overflow:hidden}
a{color:#3BE58A}a:hover{color:#8CF5BB}
.shell{position:relative;height:100vh;height:100dvh;box-sizing:border-box;padding:max(14px,env(safe-area-inset-top)) 20px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
.a-head,.stage{position:relative;z-index:1}
.stage{flex:1 1 auto;min-height:0;width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center}
.cd>div+div{border-left:1px solid rgba(232,242,236,.14)}
.ms-label{display:block}
.mi svg{width:18px;height:18px}
.hdr-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid #24443A;border-radius:999px;background:rgba(10,22,18,.6);color:#E8F2EC;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.hdr-btn:hover{border-color:#3BE58A}
.txt-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;border:0;background:none;color:#E8F2EC;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.txt-btn:hover{color:#3BE58A}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(255,210,122,.7)}100%{box-shadow:0 0 0 10px rgba(255,210,122,0)}}
@keyframes beat{0%,60%,100%{transform:scale(1)}12%{transform:scale(1.2)}24%{transform:scale(1)}36%{transform:scale(1.12)}}
@keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
@media (max-width:640px){.ms-label{display:none}.ms-keep{display:block!important}.m-hide{display:none!important}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="shell" style="background: radial-gradient(ellipse 90% 60% at 50% 25%, #10261D 0%, #08110E 70%); color: #E8F2EC; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45">

  <!-- Agua que sube con el porcentaje -->
  <canvas data-water="1" ref="{{setCanvas}}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none"></canvas>

  <!-- Cabecera -->
  <header class="a-head" style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <span style="display: inline-flex; align-items: center; gap: 10px; font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3BE58A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg>
      <span class="m-hide">Piso.exe</span>
    </span>
    <button type="button" class="txt-btn" onClick="{{openDiary}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"></path><circle cx="12" cy="13" r="3"></circle></svg>
      Diario de obra
    </button>
  </header>

  <main class="stage">
    <!-- Título -->
    <div class="fade-up" style="display: flex; flex-direction: column; gap: 6px">
      <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: #8FA89B">Cuenta atrás</p>
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 800; font-size: clamp(24px, 6.4vw, 40px); line-height: 1; letter-spacing: 0.05em; text-transform: uppercase; text-wrap: balance">Entrega del mejor piso del mundo</h1>
    </div>

    <!-- Porcentaje gigante -->
    <div class="fade-up" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; animation-delay: .1s">
      <span aria-hidden="true" style="position: absolute; left: 10%; right: 10%; top: 15%; bottom: 25%; border-radius: 50%; background: {{glow}}; filter: blur(60px); animation: glowPulse 3.2s ease-in-out infinite"></span>
      <p style="position: relative; margin: 0; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: min(36vw, 27vh, 270px); line-height: 0.85; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: {{accent}}; text-shadow: 0 0 40px {{glow}}">{{pctInt}}<span style="font-size: 0.42em">,{{pctDec}}%</span></p>
      <p style="position: relative; margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: #8FA89B">completado</p>
      <p style="position: relative; margin: 6px 0 0; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: #CFE3D8">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFD27A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4"></path><path d="M4 4h12l-2 4 2 4H4"></path></svg>
        <span>Próximo: <strong style="font-weight: 600; color: #FFD27A">{{nextName}}</strong> · {{nextIn}}</span>
      </p>
    </div>

    <!-- Barra de hitos: una línea fina con puntos -->
    <div class="fade-up" aria-label="Progreso por hitos" style="width: 100%; max-width: 680px; box-sizing: border-box; padding: 0 12px; animation-delay: .2s">
      <div style="position: relative; height: 66px; --nh: 0px">
        <div style="position: absolute; left: 0; right: 0; top: 32px; height: 3px; border-radius: 999px; background: rgba(232,242,236,.14)"></div>
        <div style="{{barStyle}}"></div>
        <sc-for list="{{milestones}}" as="m" hint-placeholder-count="7">
          <div style="{{m.nodeWrap}}">
            <span class="mi" aria-hidden="true" style="display: inline-flex; height: 18px; color: {{m.iconColor}}">
            <sc-if value="{{m.isClip}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg></sc-if>
            <sc-if value="{{m.isDoc}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M8 17c1.5-2 2.5-2 3 0s1.5 1.5 3-1"></path></svg></sc-if>
            <sc-if value="{{m.isPay}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle><path d="M6 12h.01M18 12h.01"></path></svg></sc-if>
            <sc-if value="{{m.isKey}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"></circle><path d="m10.7 12.3 9.8-9.8"></path><path d="m17 6 3 3"></path><path d="m14.5 8.5 2 2"></path></svg></sc-if>
            </span>
            <span style="{{m.node}}"></span>
            <span class="{{m.labelClass}}" style="font-size: 11px; font-weight: 600; white-space: nowrap; line-height: 1.1; color: {{m.textColor}}">{{m.name}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- Tiempo restante: números sueltos separados por líneas finas -->
    <div class="cd fade-up" style="width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); animation-delay: .3s">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: clamp(40px, 11vw, 68px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">{{days}}</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #8FA89B">días</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: clamp(40px, 11vw, 68px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">{{hours}}</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #8FA89B">horas</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: clamp(40px, 11vw, 68px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">{{mins}}</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #8FA89B">min</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: clamp(40px, 11vw, 68px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: {{accent}}; text-shadow: 0 0 20px {{glow}}">{{secs}}</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #8FA89B">seg</span>
      </div>
    </div>

    <!-- Hype -->
    <button type="button" onClick="{{addHype}}" aria-label="Subir el hype" class="fade-up" style="display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 8px; border: 0; background: none; color: #E8F2EC; cursor: pointer; animation-delay: .4s">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="#FF6B8B" aria-hidden="true" style="filter: drop-shadow(0 0 10px rgba(255,107,139,.7)); animation: beat 1.4s ease-in-out infinite"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"></path></svg>
      <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; line-height: 1">
        <span style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: 34px; font-weight: 900; color: #FF6B8B; font-variant-numeric: tabular-nums">{{hype}}</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #FFB3C3">nivel de hype</span>
      </span>
    </button>
  </main>

  <!-- Diario de obra -->
  <sc-if value="{{diaryOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 20; display: flex; justify-content: flex-end">
      <button type="button" aria-label="Cerrar el diario" onClick="{{closeDiary}}" style="position: absolute; inset: 0; border: 0; background: rgba(3,8,6,.62); cursor: pointer"></button>
      <aside aria-label="Diario de obra" style="position: relative; width: min(460px, 100%); height: 100%; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; background: #0C1814; border-left: 1px solid #24443A; animation: slideIn .35s ease-out both">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <div style="display: flex; flex-direction: column">
            <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: #8FA89B">Diario de obra</span>
            <strong style="font-family: 'Big Shoulders Display', Impact, sans-serif; font-size: 34px; font-weight: 800; line-height: 1; text-transform: uppercase">Así va el piso</strong>
          </div>
          <button type="button" class="hdr-btn" aria-label="Cerrar el diario" onClick="{{closeDiary}}" style="width: 44px; padding: 0; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
        </div>
        <p style="margin: 0; font-size: 14px; color: #B9CCC2">Cada vez que vayáis a ver el piso, guardad aquí las fotos y lo que habéis visto.</p>
        <sc-if value="{{formClosed}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{openForm}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 0; border-radius: 12px; background: {{accent}}; color: #08110E; font: 700 15px Inter, system-ui, sans-serif; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"></path><circle cx="12" cy="13" r="3"></circle></svg>
            Nueva visita al piso
          </button>
        </sc-if>
        <sc-if value="{{formOpen}}" hint-placeholder-val="{{ false }}">
          <form onSubmit="{{saveVisit}}" style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 14px; background: #10201A; border: 1px solid {{accent}}; animation: popIn .25s ease-out both">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">
              Fecha de la visita
              <input type="date" required value="{{draftDate}}" onChange="{{setDraftDate}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #3A5A4E; background: #0C1814; color: #E8F2EC; font: 500 15px Inter, system-ui, sans-serif; color-scheme: dark">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">
              Fotos
              <input type="file" accept="image/*" multiple onChange="{{setDraftPhotos}}" style="min-height: 44px; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px dashed #3A5A4E; background: #0C1814; color: #B9CCC2; font: 500 14px Inter, system-ui, sans-serif">
            </label>
            <sc-if value="{{hasDraftPhotos}}" hint-placeholder-val="{{ false }}">
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
                <sc-for list="{{draftPhotos}}" as="ph" hint-placeholder-count="2">
                  <img src="{{ph.url}}" alt="{{ph.name}}" style="width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px">
                </sc-for>
              </div>
            </sc-if>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">
              PIN del diario
              <input type="password" inputmode="numeric" autocomplete="current-password" value="{{draftPin}}" onChange="{{setDraftPin}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #3A5A4E; background: #0C1814; color: #E8F2EC; font: 500 15px Inter, system-ui, sans-serif">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">
              Notas
              <textarea rows="3" value="{{draftNote}}" onChange="{{setDraftNote}}" placeholder="¿Qué habéis visto hoy?" style="box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid #3A5A4E; background: #0C1814; color: #E8F2EC; font: 400 15px Inter, system-ui, sans-serif; resize: vertical"></textarea>
            </label>
            <sc-if value="{{hasFormError}}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; font-size: 13px; color: #FFB98F">{{formError}}</p></sc-if>
            <div style="display: flex; justify-content: flex-end; gap: 8px">
              <button type="button" class="hdr-btn" onClick="{{cancelForm}}">Cancelar</button>
              <button type="submit" disabled="{{saving}}" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: {{accent}}; color: #08110E; font: 700 14px Inter, system-ui, sans-serif; cursor: pointer">{{saveLabel}}</button>
            </div>
          </form>
        </sc-if>
        <sc-if value="{{noVisits}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 32px 16px; border-radius: 14px; border: 1px dashed #3A5A4E; text-align: center; color: #8FA89B; font-size: 14px">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20h20"></path><path d="M6 20V8l6-4 6 4v12"></path><path d="M10 20v-5h4v5"></path></svg>
            Aún no hay visitas. Añadid la primera la próxima vez que vayáis a ver el piso.
          </div>
        </sc-if>
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
          <sc-for list="{{visits}}" as="v" hint-placeholder-count="0">
            <li style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #10201A; border: 1px solid #1F3A30; animation: popIn .3s ease-out both">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
                <div style="display: flex; flex-direction: column; line-height: 1.25">
                  <strong style="font-size: 15px">{{v.dateLabel}}</strong>
                  <span style="font-size: 12px; color: #8FA89B">{{v.ago}}</span>
                </div>
                <span style="white-space: nowrap; padding: 4px 10px; border-radius: 999px; background: #1F3A30; color: #CFE3D8; font-size: 12px; font-weight: 600">La obra iba al {{v.pctAt}}</span>
              </div>
              <sc-if value="{{v.hasPhotos}}" hint-placeholder-val="{{ false }}">
                <div style="{{v.grid}}">
                  <sc-for list="{{v.photos}}" as="ph" hint-placeholder-count="2">
                    <button type="button" aria-label="Ver la foto en grande" onClick="{{ph.open}}" style="display: block; padding: 0; border: 0; background: none; cursor: zoom-in">
                      <img src="{{ph.url}}" alt="Foto de la visita" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px">
                    </button>
                  </sc-for>
                </div>
              </sc-if>
              <sc-if value="{{v.hasNote}}" hint-placeholder-val="{{ false }}">
                <p style="margin: 0; font-size: 14px; color: #CFE3D8; white-space: pre-line">{{v.note}}</p>
              </sc-if>
            </li>
          </sc-for>
        </ol>
      </aside>
      <!-- Foto en grande: se cierra tocando en cualquier sitio -->
      <sc-if value="{{photoOpen}}" hint-placeholder-val="{{ false }}">
        <div role="dialog" aria-label="Foto de la visita" onClick="{{closePhoto}}" style="position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: rgba(3,8,6,.94); cursor: zoom-out; animation: popIn .2s ease-out both">
          <img src="{{photoUrl}}" alt="Foto de la visita" style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.6)">
          <button type="button" class="hdr-btn" aria-label="Cerrar la foto" onClick="{{closePhoto}}" style="position: absolute; top: 16px; right: 16px; width: 44px; padding: 0; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
</template>
<script type="module" src="./main.js"></script>
</body>
</html>
